# Stack L'Encre Humaine — docs/07-deploy.md.
# Réseau interne ; seuls 80/443 exposés (par Caddy). `docker compose up` lève tout.
# Note : image Caddy custom (module cloudflare) = item BACKLOG (Phase 0/1).

name: encre

x-postgres-healthcheck: &pg-health
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 5

# URLs de connexion construites ICI à partir des composants (rôle + *_DB_PASSWORD)
# pour qu'AUCUN mot de passe ne soit dupliqué dans le .env : la seule source de
# vérité d'un mot de passe est sa variable `*_DB_PASSWORD`. Les rôles sont
# cloisonnés par schéma (init.sql) ; le hostname interne est toujours `postgres`.
x-app-db-url: &app-db-url postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=app

services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/init.sql:/opt/encre/init.sql:ro
    healthcheck: *pg-health
    networks: [internal]

  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_CONNECTION_STRING: postgres://directus_user:${DIRECTUS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SEARCH_PATH: directus
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      # Cookie de session posé sur le domaine PARENT (.encrehumaine.fr) → il est
      # aussi envoyé à l'app (encrehumaine.fr), ce qui permet au middleware
      # « page d'attente » de reconnaître une session Directus valide et d'ouvrir
      # le site en prévisualisation (apps/web server/utils/preview-session.ts).
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      # Live Preview : autorise Directus à afficher le site en iframe dans le
      # panneau de prévisualisation. Sans ça, la CSP par défaut de Directus
      # (child-src 'self', pas de frame-src) bloque le cadrage de tout domaine
      # externe → « contenu bloqué ». On ouvre frame-src à 'self' + le site.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "array:'self',${BASE_URL}"
      # Assets → R2 (S3-compatible). docs/02 §7, docs/07 §6.
      STORAGE_LOCATIONS: r2
      STORAGE_R2_DRIVER: s3
      STORAGE_R2_ENDPOINT: ${R2_ENDPOINT}
      STORAGE_R2_KEY: ${R2_ACCESS_KEY_ID}
      STORAGE_R2_SECRET: ${R2_SECRET_ACCESS_KEY}
      STORAGE_R2_BUCKET: ${R2_BUCKET_ASSETS}
      STORAGE_R2_REGION: auto
      STORAGE_R2_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8055/server/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.18.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      # `?schema=umami` : Prisma confine ses tables (dont `_prisma_migrations`) au
      # schéma `umami` (umami_user a search_path=umami + CREATE dessus, cf. init.sql).
      # Sans ça, Prisma vise `public` → conflit `_prisma_migrations already exists`.
      DATABASE_URL: postgres://umami_user:${UMAMI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    healthcheck:
      # Sonde via fetch natif (Node présent dans l'image Umami) → /api/heartbeat.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Sauvegardes chiffrées (pg_dump → gpg → rclone → R2). Conteneur cron :
  # planifie selon BACKUP_CRON. docs/07-deploy.md §6. Restauration : voir
  # infra/backup/README.md (`make restore`).
  backup:
    build:
      context: ./backup
    image: encre/backup:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_BACKUPS: ${R2_BUCKET_BACKUPS}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY}
    networks: [internal]

  # Job one-shot : applique les migrations Drizzle (schéma `app`) AVANT le
  # rollout de `web` (docs/07 §4). Tourne, migre, sort. `restart: "no"` →
  # `web` attend sa sortie 0 via `service_completed_successfully`.
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrate
    image: encre/migrate:dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Les migrations sont du DDL → exécutées par le SUPERUSER (comme `make
      # db-migrate`), pas par `app_user` (cloisonné à `app`, sans droit de créer
      # un schéma). init.sql (ALTER DEFAULT PRIVILEGES) octroie ensuite ALL à
      # `app_user` sur les tables ainsi créées → le runtime `web` reste restreint.
      APP_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=app
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: encre/web:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      directus:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      # Noms simples → lus par `process.env` au boot pour la VALIDATION d'env
      # (server/plugins/00.validate-env.ts ; packages/shared env schema).
      - ./env/.env
    # ⚠️ Nuxt ne peuple `useRuntimeConfig()` au runtime QUE via des clés `NUXT_*`
    # (`NUXT_PUBLIC_*` pour le bloc public). Les noms simples de l'`env_file`
    # passent la validation mais N'ATTEIGNENT PAS la config runtime → sans ces
    # mappings, Directus serait « non configuré », Turnstile/Cal.com/analytics
    # muets et le baseUrl SEO vide EN PROD (le pont `process.env` de nuxt.config
    # n'agit qu'au build/dev). Interpolation `${VAR}` depuis infra/env/.env
    # (--env-file), comme le reste du compose. TOUTE nouvelle clé runtimeConfig
    # doit être ajoutée ici.
    environment:
      # — App DB : construite à partir des composants (ancre), plus aucun mot de
      #   passe dupliqué dans .env. `APP_DATABASE_URL` (nom simple) = validation
      #   au boot ; `NUXT_APP_DATABASE_URL` = config runtime. Mêmes valeurs.
      APP_DATABASE_URL: *app-db-url
      NUXT_APP_DATABASE_URL: *app-db-url
      # — Secrets serveur —
      NUXT_DIRECTUS_READ_TOKEN: ${DIRECTUS_READ_TOKEN}
      NUXT_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NUXT_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NUXT_STRIPE_SHIPPING_RATE_FR: ${STRIPE_SHIPPING_RATE_FR}
      NUXT_RESEND_API_KEY: ${RESEND_API_KEY}
      NUXT_RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID}
      NUXT_NEWSLETTER_FROM: ${NEWSLETTER_FROM}
      NUXT_CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO}
      NUXT_TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # — Valeurs publiques (sérialisées vers le client) —
      NUXT_PUBLIC_BASE_URL: ${BASE_URL}
      # URL du site pour @nuxtjs/seo (canonical, sitemap, OG absolus) — lue au
      # runtime par nuxt-site-config (le build Docker n'a pas de .env).
      NUXT_PUBLIC_SITE_URL: ${BASE_URL}
      NUXT_PUBLIC_DIRECTUS_PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      NUXT_PUBLIC_BOOKING_URL: ${BOOKING_URL}
      NUXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL}
      NUXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID}
      NUXT_PUBLIC_VAT_ENABLED: ${VAT_ENABLED}
    healthcheck:
      # Image slim sans wget/curl → sonde via fetch natif (Node 26).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2.11.3
    restart: unless-stopped
    depends_on:
      - web
      - directus
      - umami
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BASE_DOMAIN: encrehumaine.fr
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
