# Stack L'Encre Humaine — docs/07-deploy.md.
# Réseau interne ; seuls 80/443 exposés (par Caddy). `docker compose up` lève tout.
# Note : image Caddy custom (module cloudflare) = item BACKLOG (Phase 0/1).

name: encre

x-postgres-healthcheck: &pg-health
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 5

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/init.sql:/opt/encre/init.sql:ro
    healthcheck: *pg-health
    networks: [internal]

  directus:
    image: directus/directus:11.12.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_CONNECTION_STRING: ${DIRECTUS_DB_URL}
      DB_SEARCH_PATH: directus
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      # Assets → R2 (S3-compatible). docs/02 §7, docs/07 §6.
      STORAGE_LOCATIONS: r2
      STORAGE_R2_DRIVER: s3
      STORAGE_R2_ENDPOINT: ${R2_ENDPOINT}
      STORAGE_R2_KEY: ${R2_ACCESS_KEY_ID}
      STORAGE_R2_SECRET: ${R2_SECRET_ACCESS_KEY}
      STORAGE_R2_BUCKET: ${R2_BUCKET_ASSETS}
      STORAGE_R2_REGION: auto
      STORAGE_R2_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8055/server/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.18.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: ${UMAMI_DB_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
    networks: [internal]

  # Job one-shot : applique les migrations Drizzle (schéma `app`) AVANT le
  # rollout de `web` (docs/07 §4). Tourne, migre, sort. `restart: "no"` →
  # `web` attend sa sortie 0 via `service_completed_successfully`.
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrate
    image: encre/migrate:dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Les migrations sont du DDL → exécutées par le SUPERUSER (comme `make
      # db-migrate`), pas par `app_user` (cloisonné à `app`, sans droit de créer
      # un schéma). init.sql (ALTER DEFAULT PRIVILEGES) octroie ensuite ALL à
      # `app_user` sur les tables ainsi créées → le runtime `web` reste restreint.
      APP_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=app
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: encre/web:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      directus:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./env/.env
    healthcheck:
      # Image slim sans wget/curl → sonde via fetch natif (Node 26).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    build:
      context: ./caddy
    image: encre/caddy:dev
    restart: unless-stopped
    depends_on:
      - web
      - directus
      - umami
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      BASE_DOMAIN: lencre-humaine.com
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
